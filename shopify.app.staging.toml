# Staging Shopify CLI configuration.

name = "China Supply Radar Staging"
client_id = "6dc8d5dcb95970f9f1ded2dd7c0ab53e"
application_url = "https://china-supply-radar-shopify-app-staging.up.railway.app"
embedded = true

[access_scopes]
scopes = "read_products,read_inventory,read_orders"

[auth]
redirect_urls = [
  "https://china-supply-radar-shopify-app-staging.up.railway.app/api/auth/callback"
]

[webhooks]
api_version = "2026-07"

[webhooks.privacy_compliance]
customer_data_request_url = "/webhooks/gdpr/customers_data_request"
customer_deletion_url = "/webhooks/gdpr/customers_redact"
shop_deletion_url = "/webhooks/gdpr/shop_redact"

[[webhooks.subscriptions]]
topics = ["app/uninstalled"]
uri = "/webhooks/app/uninstalled"

[pos]
embedded = false
